name: Build Android Play AAB Locally

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.android-trigger/play-aab'
      - '.github/workflows/build-android-play-aab.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build signed Play AAB with Expo credentials
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare production environment
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          EXPO_PUBLIC_ENV: production
        run: |
          node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const required = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN',
            'EXPO_PUBLIC_SENTRY_DSN',
            'MAPBOX_DOWNLOADS_TOKEN',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing GitHub build secrets: ${missing.join(', ')}`);
          const names = [...required, 'EXPO_PUBLIC_ENV'];
          const contents = names
            .map((name) => `${name}=${JSON.stringify(process.env[name] || '')}`)
            .join('\n');
          writeFileSync('.env.local', `${contents}\n`, { mode: 0o600 });
          NODE

      - name: Build signed Play bundle locally
        run: eas build --platform android --profile production --local --non-interactive --output ./skatequest-play.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

      - name: Verify bundle and signing certificate
        run: |
          test -s skatequest-play.aab
          unzip -t skatequest-play.aab
          keytool -printcert -jarfile skatequest-play.aab

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: skatequest-play-aab
          path: skatequest-play.aab
          retention-days: 14
          if-no-files-found: error
