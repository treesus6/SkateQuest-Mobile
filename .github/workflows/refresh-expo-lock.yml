name: Refresh Expo lockfile

on:
  push:
    branches:
      - chore/ai-collaboration-handoff
    paths:
      - .github/workflows/refresh-expo-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: chore/ai-collaboration-handoff
          fetch-depth: 0

      - name: Set up Node 22.22.1
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm

      - name: Regenerate Expo lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            expo@~57.0.21 expo-router@~57.0.20

      - name: Commit regenerated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No manifest changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: align Expo SDK 57 patch versions"
          git push origin HEAD:chore/ai-collaboration-handoff
