name: Refresh Expo SDK 57 Patch Versions

on:
  push:
    branches: [fix/expo-sdk57-patches]
    paths:
      - .github/workflows/update-expo-sdk57-patches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/expo-sdk57-patches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Update Expo patch dependencies and lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts \
            'expo@~57.0.20' \
            'expo-build-properties@~57.0.17' \
            'expo-image-manipulator@~57.0.16' \
            'expo-image-picker@~57.0.16' \
            'expo-location@~57.0.16' \
            'expo-notifications@~57.0.17' \
            'expo-router@~57.0.19'

          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = {
            expo: '~57.0.20',
            'expo-build-properties': '~57.0.17',
            'expo-image-manipulator': '~57.0.16',
            'expo-image-picker': '~57.0.16',
            'expo-location': '~57.0.16',
            'expo-notifications': '~57.0.17',
            'expo-router': '~57.0.19',
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.dependencies[name] !== version) {
              throw new Error(`${name}: expected ${version}, got ${pkg.dependencies[name]}`);
            }
          }
          NODE

      - name: Commit refreshed dependency metadata
        run: |
          set -euo pipefail
          rm .github/workflows/update-expo-sdk57-patches.yml
          git config user.name 'SkateQuest CI'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/update-expo-sdk57-patches.yml
          git commit -m 'fix: align Expo SDK 57 patch versions'
          git push origin HEAD:fix/expo-sdk57-patches
