name: Align Expo SDK patch dependencies

on:
  push:
    branches:
      - codex/align-expo-sdk-57-patches

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/align-expo-sdk-57-patches
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - name: Align Expo-managed dependency patch versions
        run: >-
          npm install
          @expo/metro-runtime@~57.0.15
          expo@~57.0.19
          expo-auth-session@~57.0.11
          expo-build-properties@~57.0.16
          expo-constants@~57.0.17
          expo-dev-client@~57.0.18
          expo-image@~57.0.4
          expo-image-manipulator@~57.0.15
          expo-image-picker@~57.0.15
          expo-linking@~57.0.9
          expo-location@~57.0.15
          expo-notifications@~57.0.16
          expo-router@~57.0.18
          expo-updates@~57.0.21
      - name: Verify aligned dependencies
        run: |
          npx expo-doctor@1.20.2
          npm run type-check
          npm run lint
          npm test -- --runInBand
      - name: Commit generated dependency alignment and remove helper workflow
        run: |
          rm .github/workflows/align-expo-sdk-patches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/align-expo-sdk-patches.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: align Expo SDK 57 patch dependencies"
          git push origin HEAD:codex/align-expo-sdk-57-patches
