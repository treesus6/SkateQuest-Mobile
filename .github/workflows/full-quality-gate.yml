name: SkateQuest Full Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type, lint, test, Expo, web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_ENV: test
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align Expo SDK 57 patch versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx expo install --fix

      - name: Commit Expo patch alignment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo package versions already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Expo SDK 57 patch versions"
          git push origin HEAD:main

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --runInBand

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Prepare native Mapbox web stub
        run: |
          rm -rf node_modules/@rnmapbox/maps
          mkdir -p node_modules/@rnmapbox/maps
          echo '{"name":"@rnmapbox/maps","version":"10.3.2","main":"index.js","types":"index.d.ts"}' > node_modules/@rnmapbox/maps/package.json
          echo 'module.exports={};' > node_modules/@rnmapbox/maps/index.js
          printf 'declare namespace MapboxGL {\n  type Camera = any;\n  type MapView = any;\n  const StyleURL: { [key: string]: string };\n  const MapView: any;\n  const Camera: any;\n  const UserLocation: any;\n  const ShapeSource: any;\n  const CircleLayer: any;\n  const SymbolLayer: any;\n  const LineLayer: any;\n  const PointAnnotation: any;\n  const Images: any;\n  const MarkerView: any;\n  const Callout: any;\n  function setAccessToken(token: string | undefined): void;\n}\nexport = MapboxGL;\n' > node_modules/@rnmapbox/maps/index.d.ts

      - name: Export web
        run: npx expo export --platform web --output-dir dist-quality

      - name: Verify key routes
        run: |
          test -f dist-quality/index.html
          test -f dist-quality/map.html
          test -f dist-quality/login.html
          test -f dist-quality/quests.html
          test -f dist-quality/crew.html
          test -f dist-quality/profile.html
          test -f dist-quality/skate-tv.html
          test -f dist-quality/manifest.webmanifest
          test -f dist-quality/service-worker.js
