name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/expo-sdk57-patch-alignment-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx expo-doctor@1.20.2 --verbose
      - name: Save repaired lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: regenerate Expo SDK 57 lockfile'
            git push origin HEAD:${{ github.head_ref }}
          fi

  lint-typecheck-test:
    name: Lint, Typecheck, Test & Expo Doctor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: |
          # Remove rnmapbox for CI install, then provide a lightweight type/runtime stub.
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));delete p.dependencies['@rnmapbox/maps'];fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

          npm ci

          # Restore the real manifest so Expo Doctor validates the project as committed.
          git checkout -- package.json

          mkdir -p node_modules/@rnmapbox/maps
          echo '{"name":"@rnmapbox/maps","version":"10.3.2","main":"index.js","types":"index.d.ts"}' > node_modules/@rnmapbox/maps/package.json
          echo 'module.exports={};' > node_modules/@rnmapbox/maps/index.js
          printf 'declare namespace MapboxGL {\n  type Camera = any;\n  type MapView = any;\n  const StyleURL: { [key: string]: string };\n  const MapView: any;\n  const Camera: any;\n  const UserLocation: any;\n  const ShapeSource: any;\n  const CircleLayer: any;\n  const SymbolLayer: any;\n  const LineLayer: any;\n  const PointAnnotation: any;\n  const Images: any;\n  const MarkerView: any;\n  const Callout: any;\n  function setAccessToken(token: string | undefined): void;\n}\nexport = MapboxGL;\n' > node_modules/@rnmapbox/maps/index.d.ts

      - name: TypeScript typecheck
        run: |
          npx tsc --noEmit 2>&1 \
            | grep -v node_modules \
            | grep -v __tests__ \
            | grep -v ".d.ts" \
            | tee /tmp/ts-errors.txt
          if grep -q "error TS" /tmp/ts-errors.txt; then
            echo "TypeScript errors found!"
            exit 1
          fi

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Jest
        run: npm test -- --runInBand

      - name: Expo Doctor
        # Pin the doctor so CI does not silently change validation rules between runs.
        run: npx expo-doctor@1.20.2
