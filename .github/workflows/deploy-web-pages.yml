name: Deploy Web PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Expo web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # SkateQuest.me is an apex custom domain, so the site is served from /
      # instead of the old /SkateQuest-Mobile GitHub Pages subpath.
      EXPO_PUBLIC_BASE_URL: ''
      EXPO_PUBLIC_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: |
          # Keep package.json and package-lock.json untouched so npm ci can
          # perform its required frozen install. The native Mapbox package is
          # installed from the lockfile, then replaced with a tiny web-build
          # stub so Expo cannot accidentally pull native code into the PWA.
          npm ci

          rm -rf node_modules/@rnmapbox/maps
          mkdir -p node_modules/@rnmapbox/maps
          echo '{"name":"@rnmapbox/maps","version":"10.3.2","main":"index.js","types":"index.d.ts"}' > node_modules/@rnmapbox/maps/package.json
          echo 'module.exports={};' > node_modules/@rnmapbox/maps/index.js
          printf 'declare namespace MapboxGL {\n  type Camera = any;\n  type MapView = any;\n  const StyleURL: { [key: string]: string };\n  const MapView: any;\n  const Camera: any;\n  const UserLocation: any;\n  const ShapeSource: any;\n  const CircleLayer: any;\n  const SymbolLayer: any;\n  const LineLayer: any;\n  const PointAnnotation: any;\n  const Images: any;\n  const MarkerView: any;\n  const Callout: any;\n  function setAccessToken(token: string | undefined): void;\n}\nexport = MapboxGL;\n' > node_modules/@rnmapbox/maps/index.d.ts

      - name: Verify required public runtime variables
        run: |
          node - <<'NODE'
          const required = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            throw new Error(`Missing GitHub Pages secrets: ${missing.join(', ')}`);
          }
          NODE

      - name: Build static web app
        run: npx expo export --platform web --output-dir dist

      - name: Verify core PWA export
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/service-worker.js
          grep -q '"name": "SkateQuest"' dist/manifest.webmanifest

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy and verify GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production HTTPS PWA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 \
              https://skatequest.me/manifest.webmanifest -o /tmp/skatequest-manifest \
              && grep -q '"name": "SkateQuest"' /tmp/skatequest-manifest \
              && curl --fail --silent --show-error --location --max-time 20 \
                https://skatequest.me/service-worker.js -o /tmp/skatequest-sw \
              && grep -q 'skatequest-shell-' /tmp/skatequest-sw; then
              echo 'SkateQuest production HTTPS PWA is reachable and serving the expected assets.'
              exit 0
            fi
            echo "Production PWA check attempt ${attempt} failed; retrying."
            sleep 10
          done

          echo 'Production HTTPS PWA did not become healthy after deployment.' >&2
          exit 1

  report-web-health:
    name: Report production web health
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish web health status and manage failure issue
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const title = '[web-deploy] Production PWA deployment failed';
            const failed =
              process.env.BUILD_RESULT !== 'success' ||
              process.env.DEPLOY_RESULT !== 'success';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: failed ? 'failure' : 'success',
              target_url: runUrl,
              description: failed
                ? `Build ${process.env.BUILD_RESULT}; deploy/HTTPS ${process.env.DEPLOY_RESULT}`.slice(0, 140)
                : 'Production HTTPS PWA is healthy',
              context: 'SkateQuest production web',
            });

            const body = [
              'SkateQuest production web deployment health check failed.',
              '',
              `- Build: **${process.env.BUILD_RESULT}**`,
              `- Deploy / HTTPS smoke check: **${process.env.DEPLOY_RESULT}**`,
              `- Commit: \`${context.sha}\``,
              `- Workflow run: ${runUrl}`,
              '',
              'The deploy workflow verifies the exported PWA plus the live HTTPS manifest and service worker at `https://skatequest.me`.',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              issue => !issue.pull_request && issue.title === title
            );

            if (failed) {
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Recovered on commit \`${context.sha}\`. Production HTTPS smoke check passed.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
