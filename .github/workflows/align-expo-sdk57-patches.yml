name: Align Expo SDK 57 patches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-expo-sdk57-patches.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Align Expo SDK 57 patch versions
        run: |
          npm install             expo@~57.0.28             expo-auth-session@~57.0.15             expo-constants@~57.0.21             expo-crypto@~57.0.4             expo-dev-client@~57.0.20             expo-image-manipulator@~57.0.21             expo-linking@~57.0.12             expo-location@~57.0.21             expo-notifications@~57.0.22             expo-router@~57.0.26             expo-updates@~57.0.26
          npm install --save-dev jest-expo@~57.0.6
      - name: Verify Expo package alignment
        run: npx expo-doctor@1.20.2
      - name: Commit aligned package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Expo SDK 57 patch versions"
          git push origin HEAD:main
