name: Build Android Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/android-standalone-signing-20261012]
    paths:
      - '.android-trigger/release'
      - '.github/workflows/build-android-apk.yml'
      - 'eas.json'
      - 'scripts/verify_standalone_apk.py'

permissions:
  contents: read

jobs:
  build:
    name: Build standalone APK with Expo credentials
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare production environment
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          EXPO_PUBLIC_ENV: production
        run: |
          node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const required = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN',
            'EXPO_PUBLIC_SENTRY_DSN',
            'MAPBOX_DOWNLOADS_TOKEN',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing GitHub build secrets: ${missing.join(', ')}`);
          if (!process.env.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN.startsWith('pk.')) {
            throw new Error('EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN must be a Mapbox public token beginning with pk.');
          }
          if (!process.env.MAPBOX_DOWNLOADS_TOKEN.startsWith('sk.')) {
            throw new Error('MAPBOX_DOWNLOADS_TOKEN must be a Mapbox secret token beginning with sk.');
          }
          const names = [...required, 'EXPO_PUBLIC_ENV'];
          const contents = names
            .map((name) => `${name}=${JSON.stringify(process.env[name] || '')}`)
            .join('\n');
          writeFileSync('.env.local', `${contents}\n`, { mode: 0o600 });
          NODE

      - name: Build standalone release APK locally
        run: eas build --platform android --profile production-apk --local --non-interactive --output ./skatequest-standalone.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

      - name: Test artifact validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_verify_standalone_apk.py'

      - name: Verify standalone app and upload certificate
        env:
          EXPECTED_SIGNING_SHA256: 2F:C9:59:AD:2A:29:40:BA:8B:83:1B:3B:52:50:AD:CF:45:FB:81:48:F9:C8:3C:50:C3:F8:4B:AA:3C:8A:3A:0B
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          python3 scripts/verify_standalone_apk.py skatequest-standalone.apk \
            --aapt "$AAPT" --apksigner "$APKSIGNER" \
            --expected-sha256 "$EXPECTED_SIGNING_SHA256"

      - name: Upload verified standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: skatequest-standalone-apk
          path: skatequest-standalone.apk
          retention-days: 14
          if-no-files-found: error
