name: Build Android Installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - '.android-trigger/release'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime configuration
        shell: bash
        run: |
          missing=()
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN MAPBOX_DOWNLOADS_TOKEN; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required Android build secrets: ${missing[*]}"
            exit 1
          fi
          if [[ "$EXPO_PUBLIC_SUPABASE_URL" == *"configuration-missing"* ]]; then
            echo "::error::Supabase URL is still the missing-configuration fallback"
            exit 1
          fi

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: skatequest-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Detect release signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/skatequest.keystore
          test -s android/app/skatequest.keystore

      - name: Build signed release APK + AAB
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
          ANDROID_KEYSTORE_PATH: skatequest.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify packaged runtime configuration
        shell: bash
        run: |
          verify_config() {
            local apk="$1"
            unzip -p "$apk" assets/app.config | node -e '
              let input = "";
              process.stdin.on("data", chunk => { input += chunk; });
              process.stdin.on("end", () => {
                const config = JSON.parse(input);
                const extra = config.extra || {};
                const missing = ["supabaseUrl", "supabaseAnonKey", "mapboxAccessToken"]
                  .filter(name => typeof extra[name] !== "string" || extra[name].trim() === "");
                if (missing.length) {
                  throw new Error(`Packaged APK is missing runtime configuration: ${missing.join(", ")}`);
                }
                if (extra.supabaseUrl.includes("configuration-missing")) {
                  throw new Error("Packaged APK contains the Supabase fallback URL");
                }
                console.log(`Verified packaged runtime configuration in ${process.argv[1]}`);
              });
            ' "$apk"
          }

          for apk in android/app/build/outputs/apk/debug/*.apk; do
            verify_config "$apk"
          done
          if [ "$HAS_RELEASE_KEYSTORE" = 'true' ]; then
            for apk in android/app/build/outputs/apk/release/*.apk; do
              verify_config "$apk"
            done
          fi

      - name: Verify release signing identity
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        env:
          EXPECTED_SIGNING_SHA256: 2F:C9:59:AD:2A:29:40:BA:8B:83:1B:3B:52:50:AD:CF:45:FB:81:48:F9:C8:3C:50:C3:F8:4B:AA:3C:8A:3A:0B
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            actual="$($APKSIGNER verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
            if [ "$actual" != "$EXPECTED_SIGNING_SHA256" ]; then
              echo "::error::Release signing certificate mismatch (got $actual)"
              exit 1
            fi
          done

      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: skatequest-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed release AAB
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: skatequest-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error
