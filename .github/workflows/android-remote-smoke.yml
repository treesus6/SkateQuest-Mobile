name: Android Remote Emulator Smoke Test

# This workflow tests a supplied/previous EAS artifact, which may predate main.
# Do not automatically mark a new main commit as Android-verified using a stale APK.
# Current-source APK verification runs in eas-local-preview-apk.yml.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct HTTPS URL to an installable SkateQuest APK (EAS artifact)
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Install and launch APK on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install project dependencies for Expo config resolution
        run: npm ci

      - name: Find EAS preview artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROVIDED_URL: ${{ inputs.apk_url }}
        run: |
          if [ -n "$PROVIDED_URL" ]; then
            echo "APK_URL=$PROVIDED_URL" >> "$GITHUB_ENV"
          else
            npm install --global eas-cli
            npx expo config --type public --json > /tmp/expo-project.json
            eas whoami --non-interactive
            eas build:list --platform android --limit 20 --json --non-interactive > /tmp/builds.json
          python3 - <<'PY'
          import json, os
          builds = json.load(open('/tmp/builds.json'))
          matches = [b for b in builds if b.get('buildProfile') == 'preview' and b.get('status') == 'FINISHED' and (b.get('artifacts') or {}).get('buildUrl')]
          if not matches:
              raise SystemExit('No finished signed preview APK available; run the preview build workflow first')
          matches.sort(key=lambda b: b.get('createdAt') or '', reverse=True)
          selected = matches[0]
          print('Testing existing signed EAS preview build:', selected.get('id'), 'commit:', selected.get('gitCommitHash'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APK_URL=' + selected['artifacts']['buildUrl'] + chr(10))
          PY
          fi

      - name: Validate APK source
        env:
          APK_URL: ${{ env.APK_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["APK_URL"])
          if u.scheme != "https" or not u.hostname or u.username or u.password:
              raise SystemExit("APK URL must be HTTPS without embedded credentials")
          print("APK URL scheme and host validated")
          PY

      - name: Download installable APK
        env:
          APK_URL: ${{ env.APK_URL }}
        run: |
          curl --fail --location --retry 3 --max-time 240 --output /tmp/skatequest.apk "$APK_URL"
          test "$(stat -c%s /tmp/skatequest.apk)" -gt 1000000
          file /tmp/skatequest.apk
          unzip -t /tmp/skatequest.apk >/dev/null
          echo "APK downloaded and ZIP structure validated"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify APK signature and package
        run: |
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/skatequest.apk
          "$SDK_BUILD_TOOLS/aapt" dump badging /tmp/skatequest.apk | grep -Fq "package: name='com.treesus6.skatequest'"
          echo "PASS: signed APK and expected package verified"

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo '::warning::/dev/kvm unavailable'; fi

      - name: Android emulator startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 384M
          script: bash scripts/android-smoke.sh

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skatequest-android-emulator-evidence
          path: |
            /tmp/skatequest-logcat.txt
            /tmp/skatequest-startup.png
            /tmp/activities.txt
            /tmp/skatequest.pid
          if-no-files-found: warn
          retention-days: 7
