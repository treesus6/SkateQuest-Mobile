name: Harden Android release policy

on:
  push:
    branches:
      - codex/android-release-runtime
    paths:
      - '.github/workflows/harden-android-release-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/android-release-runtime
      - name: Add packaged permission verification and update store prep
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/build-android-apk.yml')
          text = workflow.read_text()
          anchor = """      - name: Verify packaged runtime configuration\n        shell: bash\n"""
          check = """      - name: Verify packaged Android permission policy\n        shell: bash\n        run: |\n          AAPT=\"$(find \"$ANDROID_HOME/build-tools\" -type f -name aapt | sort -V | tail -1)\"\n          test -x \"$AAPT\"\n          shopt -s nullglob\n          apks=(android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk)\n          if [ \"${#apks[@]}\" -eq 0 ]; then\n            echo \"::error::No APKs found for packaged permission verification\"\n            exit 1\n          fi\n          for apk in \"${apks[@]}\"; do\n            echo \"Inspecting packaged permissions in $apk\"\n            permissions=\"$(\"$AAPT\" dump permissions \"$apk\")\"\n            printf '%s\\n' \"$permissions\"\n            for forbidden in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO; do\n              if printf '%s\\n' \"$permissions\" | grep -q \"android.permission.${forbidden}\"; then\n                echo \"::error::Forbidden broad media/storage permission packaged in $apk: android.permission.${forbidden}\"\n                exit 1\n              fi\n            done\n          done\n\n"""
          if 'Verify packaged Android permission policy' not in text:
              if anchor not in text:
                  raise SystemExit('Android workflow insertion point not found')
              text = text.replace(anchor, check + anchor, 1)
          workflow.write_text(text)

          doc = Path('APP_STORE_PREP.md')
          text = doc.read_text()
          old = """      \"permissions\": [\n        \"ACCESS_COARSE_LOCATION\",\n        \"ACCESS_FINE_LOCATION\",\n        \"CAMERA\",\n        \"READ_EXTERNAL_STORAGE\",\n        \"WRITE_EXTERNAL_STORAGE\"\n      ]\n"""
          new = """      \"permissions\": [\n        \"ACCESS_COARSE_LOCATION\",\n        \"ACCESS_FINE_LOCATION\",\n        \"CAMERA\",\n        \"RECORD_AUDIO\"\n      ],\n      \"blockedPermissions\": [\n        \"android.permission.READ_EXTERNAL_STORAGE\",\n        \"android.permission.WRITE_EXTERNAL_STORAGE\",\n        \"android.permission.READ_MEDIA_IMAGES\",\n        \"android.permission.READ_MEDIA_VIDEO\"\n      ]\n"""
          if old not in text:
              raise SystemExit('APP_STORE_PREP Android permission example not found')
          text = text.replace(old, new, 1)
          note = """\n> Android media uploads use the system photo/video picker. Do not request broad photo/video or legacy external-storage permissions for the Play build. The release workflow verifies the packaged APK permissions and fails if those permissions return.\n\n"""
          marker = '## Building for Production\n'
          if note.strip() not in text:
              text = text.replace(marker, note + marker, 1)
          doc.write_text(text)
          PY

          rm .github/workflows/harden-android-release-policy.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-android-apk.yml APP_STORE_PREP.md .github/workflows/harden-android-release-policy.yml
          git commit -m 'ci(android): enforce packaged media permission policy'
          git push
