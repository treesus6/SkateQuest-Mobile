name: Verify Production Web Auth

on:
  workflow_run:
    workflows: ['Deploy Web PWA to GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web-auth:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://hreeuqdgrwvnxquxohod.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Verify production auth routes
        shell: bash
        run: |
          set -euo pipefail
          for route in /login /callback /reset-password; do
            file="/tmp/skatequest-${route#/}.html"
            curl --fail --location --silent --show-error \
              --retry 4 --retry-delay 5 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://skatequest.me${route}" -o "$file"
            grep -qi '<html' "$file"
          done

      - name: Verify Google provider is enabled
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY"
          settings=$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/settings")

          enabled=$(printf '%s' "$settings" | jq -r '.external.google // false')
          echo "Google provider enabled: $enabled"
          test "$enabled" = 'true'

      - name: Verify Google OAuth starts for the production callback
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/authorize?provider=google&redirect_to=https%3A%2F%2Fskatequest.me%2Fcallback")

          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")
          echo "OAuth start HTTP status: $status"

          if [ "$status" -lt 300 ] || [ "$status" -ge 400 ]; then
            echo 'Google OAuth did not return a redirect.' >&2
            cat "$body"
            exit 1
          fi

          case "$location" in
            https://accounts.google.com/*)
              echo 'Google OAuth redirect verified.'
              ;;
            *)
              echo 'Unexpected OAuth redirect target:' >&2
              echo "$location" >&2
              exit 1
              ;;
          esac
