name: Sync Expo SDK 57 patches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-expo-sdk57-patches.yml'

permissions:
  contents: write

concurrency:
  group: sync-expo-sdk57-patches
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Align Expo SDK 57 patch versions
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo install --fix

      - name: Verify Expo Doctor
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo-doctor

      - name: Commit repaired manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/sync-expo-sdk57-patches.yml
          git commit -m "chore: align Expo SDK 57 patch versions"
          git push origin HEAD:main
