name: Fix Android media picker permissions

on:
  push:
    branches:
      - codex/android-release-runtime
    paths:
      - '.github/workflows/fix-android-media-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/android-release-runtime
      - name: Patch SkateTV picker permission handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('screens/SkateTVLiveScreen.tsx')
          text = live.read_text()
          if "  Platform,\n" not in text:
              text = text.replace("  Modal,\n  Pressable,", "  Modal,\n  Platform,\n  Pressable,", 1)
          old = """  const pickVideo = async () => {\n    const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n    if (permission.status !== 'granted') {\n      Alert.alert('Permission needed', 'SkateQuest needs media access to post a clip.');\n      return;\n    }\n    const result = await ImagePicker.launchImageLibraryAsync({\n"""
          new = """  const pickVideo = async () => {\n    if (Platform.OS === 'ios') {\n      const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n      if (permission.status !== 'granted') {\n        Alert.alert('Permission needed', 'SkateQuest needs media access to post a clip.');\n        return;\n      }\n    }\n    const result = await ImagePicker.launchImageLibraryAsync({\n"""
          if old not in text:
              raise SystemExit('SkateTVLiveScreen picker block not found')
          live.write_text(text.replace(old, new, 1))

          verified = Path('screens/SkateTVVerifiedScreen.tsx')
          text = verified.read_text()
          if "  Platform,\n" not in text:
              text = text.replace("  Modal,\n  RefreshControl,", "  Modal,\n  Platform,\n  RefreshControl,", 1)
          old = """  const pickVideo = async () => {\n    const { status } = await ImagePicker.requestMediaLibraryPermissionsAsync();\n    if (status !== 'granted') {\n      Alert.alert('Permission required', 'Allow media access to choose a real video clip.');\n      return;\n    }\n\n    const result = await ImagePicker.launchImageLibraryAsync({\n"""
          new = """  const pickVideo = async () => {\n    if (Platform.OS === 'ios') {\n      const { status } = await ImagePicker.requestMediaLibraryPermissionsAsync();\n      if (status !== 'granted') {\n        Alert.alert('Permission required', 'Allow media access to choose a real video clip.');\n        return;\n      }\n    }\n\n    const result = await ImagePicker.launchImageLibraryAsync({\n"""
          if old not in text:
              raise SystemExit('SkateTVVerifiedScreen picker block not found')
          verified.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/fix-android-media-picker.yml

          git diff --check
          git diff -- screens/SkateTVLiveScreen.tsx screens/SkateTVVerifiedScreen.tsx

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screens/SkateTVLiveScreen.tsx screens/SkateTVVerifiedScreen.tsx .github/workflows/fix-android-media-picker.yml
          git commit -m 'fix(android): use system picker for SkateTV uploads'
          git push
