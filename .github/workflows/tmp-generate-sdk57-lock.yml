name: Generate SDK 57 patch lockfile

on:
  push:
    branches:
      - codex/expo-sdk57-patch-drift-20261001

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/expo-sdk57-patch-drift-20261001
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify frozen install and Expo alignment
        run: |
          npm ci
          npx expo-doctor@1.20.2
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate Expo SDK 57 lockfile"
          git push origin HEAD:codex/expo-sdk57-patch-drift-20261001
