name: Jest Diagnostic

on:
  push:
    branches:
      - chatgpt/jest-diagnostic
  workflow_dispatch:

jobs:
  jest-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Jest and save report
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --json --outputFile=jest-results.json 2>&1 | tee jest-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > jest-exit-code.txt
          exit 0
      - name: Upload Jest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: jest-diagnostics
          path: |
            jest-results.json
            jest-output.txt
            jest-exit-code.txt
          if-no-files-found: warn
