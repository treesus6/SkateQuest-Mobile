name: Repair Expo SDK 57 lockfile
on:
  push:
    branches:
      - fix/expo-sdk57-patch-alignment-20261022
    paths:
      - '.github/workflows/repair-expo-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify frozen installation
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency alignment
        run: npx expo-doctor@1.20.2
      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate Expo SDK 57 npm lockfile"
            git push
          fi
