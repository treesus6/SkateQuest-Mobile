name: Verify Preview Mapbox Access
on:
  push:
    paths:
      - '.github/workflows/mapbox-token-health.yml'
      - 'scripts/mapbox-token-health.cjs'
      - 'lib/mapboxSetup.native.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm ci
      - run: npm install --global eas-cli
      - id: github_probe
        name: Validate existing GitHub public Mapbox token
        env:
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        run: node scripts/mapbox-token-health.cjs
      - id: eas_probe
        name: Check EAS preview public Mapbox token
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN missing"; exit 1; }
          eas env:exec preview "node scripts/mapbox-token-health.cjs" --non-interactive
      - name: Repair only EAS preview token from validated GitHub token
        if: ${{ steps.github_probe.outcome == 'success' && steps.eas_probe.outcome == 'failure' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" && test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN"
          eas env:set --name EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN_PREVIEW --value "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" --environment preview --visibility sensitive --scope project --non-interactive
      - name: Confirm EAS preview style and tiles are authorized
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:exec preview "node scripts/mapbox-token-health.cjs" --non-interactive
