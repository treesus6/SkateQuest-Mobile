name: Repair invalid RN font weights

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-invalid-font-weights.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace invalid weights
        run: |
          sed -i "s/fontWeight: '650'/fontWeight: '600'/g" screens/CrewTerritoryScreen.tsx screens/CrewsScreen.tsx
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens/CrewTerritoryScreen.tsx screens/CrewsScreen.tsx
          git rm .github/workflows/fix-invalid-font-weights.yml
          git commit -m "fix: use valid React Native font weights"
          git push origin HEAD:main
