name: Generate session migration filename

on:
  push:
    branches:
      - codex/session-integrity

permissions:
  contents: write

jobs:
  migration-name:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/session-integrity
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
      - name: Discover Supabase CLI
        run: |
          npx --yes supabase@latest --help
          npx --yes supabase@latest migration new --help
      - name: Generate migration
        run: npx --yes supabase@latest migration new make_activity_session_feed_server_verified
      - name: Commit generated migration shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore(db): generate session migration shell"
          git push origin HEAD:codex/session-integrity
