name: Align current Expo SDK 57 patches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-current-expo57.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Align SDK 57 patch versions
        run: |
          npm install \
            @expo/metro-runtime@~57.0.18 \
            expo@~57.0.32 \
            expo-build-properties@~57.0.23 \
            expo-constants@~57.0.23 \
            expo-dev-client@~57.0.21 \
            expo-image-manipulator@~57.0.22 \
            expo-image-picker@~57.0.21 \
            expo-location@~57.0.23 \
            expo-notifications@~57.0.25 \
            expo-observe@~57.0.27 \
            expo-router@~57.0.30 \
            expo-updates@~57.0.27
      - name: Verify alignment
        run: npx expo-doctor@1.20.2
      - name: Commit package alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align current Expo SDK 57 patches"
          git push origin HEAD:main
