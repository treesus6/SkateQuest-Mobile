name: Agent Android Preview Build and Emulator Test
on:
  push:
    paths:
      - '.github/workflows/agent-android-preview-emulator.yml'
      - 'screens/MapScreen.native.tsx'
      - 'screens/AddSpotScreen.native.tsx'
      - 'lib/mapboxSetup.native.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci
      - run: npm install --global eas-cli
      - name: Build signed preview APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN"; exit 1; }
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/eas-build-started-at
          set -o pipefail
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee /tmp/eas-build-output.txt
      - name: Retrieve APK built during this workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --limit 20 --json --non-interactive > /tmp/builds.json
          python3 - <<'PY'
          import json, os, re
          output = open('/tmp/eas-build-output.txt').read()
          ids = list(dict.fromkeys(re.findall(r'expo\.dev/accounts/[^/\s]+/projects/[^/\s]+/builds/([0-9a-fA-F-]{36})', output)))
          if len(ids) != 1:
              raise SystemExit(f'Could not uniquely identify EAS build from CLI output (found {len(ids)} IDs)')
          builds = json.load(open('/tmp/builds.json'))
          matches = [b for b in builds if b.get('id', '').lower() == ids[0].lower()
                     and b.get('buildProfile') == 'preview' and b.get('status') == 'FINISHED'
                     and (b.get('artifacts') or {}).get('buildUrl')]
          if len(matches) != 1:
              raise SystemExit('The EAS build started by this workflow is not a completed preview APK in build:list')
          build = matches[0]
          print('Selected exact EAS build:', build['id'], 'gitCommitHash:', build.get('gitCommitHash'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APK_URL=' + build['artifacts']['buildUrl'] + chr(10))
          PY
      - name: Download and validate APK
        env:
          APK_URL: ${{ env.APK_URL }}
        run: |
          test -n "$APK_URL" || { echo "::error::No APK URL"; exit 1; }
          curl --fail --location --retry 3 --max-time 300 -o /tmp/skatequest.apk "$APK_URL"
          test "$(stat -c%s /tmp/skatequest.apk)" -gt 1000000
          unzip -t /tmp/skatequest.apk >/dev/null
      - name: Verify APK signature and package
        run: |
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs /tmp/skatequest.apk
          "$TOOLS/aapt" dump badging /tmp/skatequest.apk | grep -q "package: name='com.treesus6.skatequest'"
      - name: Enable KVM acceleration for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo '::warning::/dev/kvm unavailable; emulator may boot slowly'
          fi
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 384M
          script: bash scripts/android-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-emulator-evidence
          path: |
            /tmp/skatequest-logcat.txt
            /tmp/skatequest-startup.png
            /tmp/activities.txt
            /tmp/skatequest.pid
          if-no-files-found: warn
          retention-days: 7
