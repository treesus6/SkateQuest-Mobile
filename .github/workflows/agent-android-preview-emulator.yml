name: Agent Android Preview Build and Emulator Test
on:
  push:
    paths:
      - '.github/workflows/agent-android-preview-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci
      - run: npm install --global eas-cli
      - name: Build signed preview APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN"; exit 1; }
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/eas-build-started-at
          eas build --platform android --profile preview --non-interactive --wait
      - name: Retrieve APK built during this workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --limit 20 --json --non-interactive > /tmp/builds.json
          python3 - <<'PY'
          import datetime, json, os
          builds = json.load(open('/tmp/builds.json'))
          started = datetime.datetime.fromisoformat(open('/tmp/eas-build-started-at').read().strip().replace('Z','+00:00'))
          candidates = []
          for build in builds:
              created = build.get('createdAt') or ''
              try:
                  created_at = datetime.datetime.fromisoformat(created.replace('Z','+00:00'))
              except ValueError:
                  continue
              if (build.get('buildProfile') == 'preview' and build.get('status') == 'FINISHED'
                  and created_at >= started and (build.get('artifacts') or {}).get('buildUrl')):
                  candidates.append(build)
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one completed preview APK from this run; found {len(candidates)}. Refusing stale or ambiguous artifact.')
          build = candidates[0]
          print('Selected EAS build:', build.get('id'), 'gitCommitHash:', build.get('gitCommitHash'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APK_URL=' + build['artifacts']['buildUrl'] + chr(10))
          PY
      - name: Download and validate APK
        env:
          APK_URL: ${{ env.APK_URL }}
        run: |
          test -n "$APK_URL" || { echo "::error::No APK URL"; exit 1; }
          curl --fail --location --retry 3 --max-time 300 -o /tmp/skatequest.apk "$APK_URL"
          test "$(stat -c%s /tmp/skatequest.apk)" -gt 1000000
          unzip -t /tmp/skatequest.apk >/dev/null
      - name: Verify APK signature and package
        run: |
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs /tmp/skatequest.apk
          "$TOOLS/aapt" dump badging /tmp/skatequest.apk | grep -q "package: name='com.treesus6.skatequest'"
      - name: Enable KVM acceleration for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo '::warning::/dev/kvm unavailable; emulator may boot slowly'
          fi
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 384M
          script: bash scripts/android-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-emulator-evidence
          path: |
            /tmp/skatequest-logcat.txt
            /tmp/skatequest-startup.png
            /tmp/activities.txt
            /tmp/skatequest.pid
          if-no-files-found: warn
          retention-days: 7
